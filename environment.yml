name: bertopic_env
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.9.23
  - pip=25.1.1
  
  # Jupyter ecosystem
  - jupyter=1.1.1
  - jupyterlab=4.4.5
  - notebook=7.4.4
  - ipykernel=6.30.0
  - ipython=8.12.0
  - ipywidgets=8.1.7
  
  # Core scientific computing (conda)
  - numpy=1.26.4  # Pinned to avoid NumPy 2.x conflicts
  - mkl=2022.2.1  # For optimized linear algebra
  - libopenblas=0.3.30
  
  # System dependencies
  - ca-certificates=2025.7.14
  - certifi=2025.7.14
  - openssl=3.5.1
  - requests=2.32.4
  - urllib3=2.5.0
  
  # Text processing
  - beautifulsoup4=4.13.4
  
  # Visualization base
  - pillow=9.4.0
  - freetype=2.13.3
  - fontconfig=2.15.0
  
  # pip dependencies (ML/NLP packages)
  - pip:
    # Core ML/Data Science
    - pandas==2.3.1
    - scikit-learn==1.6.1
    - scipy==1.13.1
    - matplotlib==3.9.4
    - seaborn==0.13.2
    - plotly==6.2.0
    
    # Text processing & NLP
    - nltk==3.9.1
    - wordcloud==1.9.4
    - python-dotenv==1.1.1
    
    # Topic modeling & embeddings
    - bertopic==0.17.3
    - sentence-transformers==5.0.0
    - transformers==4.54.1
    - tokenizers==0.21.4
    - huggingface-hub==0.34.3
    - safetensors==0.5.3
    
    # Clustering & dimensionality reduction
    - umap-learn==0.5.9.post2
    - hdbscan==0.8.40
    - pynndescent==0.5.13
    
    # PyTorch (CPU version for embeddings)
    - torch==2.2.2
    
    # Visualization & interactive plots
    - datamapplot==0.6.3
    - datashader==0.17.0
    - bokeh==3.4.3
    - colorcet==3.1.0
    - param==2.2.1
    - pyct==0.5.0
    
    # Scientific computing extensions
    - numba==0.60.0
    - llvmlite==0.43.0
    - imageio==2.37.0
    - scikit-image==0.24.0
    - tifffile==2024.8.30
    - networkx==3.2.1
    - sympy==1.14.0
    
    # Parallel computing
    - dask==2024.8.0
    - dask-expr==1.1.10
    - distributed==2024.8.0
    
    # Utilities
    - tqdm==4.67.1
    - click==8.1.8
    - joblib==1.5.1
    - regex==2025.7.33
    - pyyaml==5.4.1
    - filelock==3.18.0
    - fsspec==2025.7.0
    
    # OpenAI (optional - for AI summaries)
    - openai==1.99.0
    - pydantic==2.11.7
    - pydantic-core==2.33.2
    
    # Data handling
    - pyarrow==21.0.0
    - pyarrow-hotfix==0.7
    - xarray==2024.7.0
    
    # Additional utilities
    - cloudpickle==3.1.1
    - lz4==4.4.4
    - toolz==1.0.0
    - sortedcontainers==2.4.0
    - multipledispatch==1.0.0
    - narwhals==2.0.1